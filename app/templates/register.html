{% extends 'base.html' %}
{% block content %}

<div class="w-full min-h-screen bg-[#D7BF84] flex items-center justify-center px-4 py-10">

    <div class="w-full max-w-5xl bg-transparent relative">

        <form method="POST"
              class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-transparent">

            <div class="flex flex-col gap-6">

                <div>
                    <label for="nome" class="text-gray-700 font-semibold">Nome:</label>
                    <input type="text" id="nome" name="nome" required
                           class="w-full mt-1 px-5 py-3 rounded-full bg-white shadow focus:ring-2 focus:ring-blue-400 outline-none">
                </div>

                <div>
                    <label for="cidade" class="text-gray-700 font-semibold">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" required
                           class="w-full mt-1 px-5 py-3 rounded-full bg-white shadow focus:ring-2 focus:ring-blue-400 outline-none">
                </div>

                <div>
                    <label for="estado" class="text-gray-700 font-semibold">Estado:</label>
                    <input type="text" id="estado" name="estado" required
                           class="w-full mt-1 px-5 py-3 rounded-full bg-white shadow focus:ring-2 focus:ring-blue-400 outline-none">
                </div>

                <div>
                    <label for="telefone" class="text-gray-700 font-semibold">Telefone:</label>
                    <input type="text" id="telefone" name="telefone" required
                           class="w-full mt-1 px-5 py-3 rounded-full bg-white shadow focus:ring-2 focus:ring-blue-400 outline-none">
                </div>

            </div>

            <div class="flex flex-col gap-6">

               
                <div>
                    <label for="email" class="text-gray-700 font-semibold">Email:</label>
                    <input type="email" id="email" name="email" required
                           class="w-full mt-1 px-5 py-3 rounded-full bg-white shadow focus:ring-2 focus:ring-blue-400 outline-none">
                </div>

                
                <div>
                    <label for="senha" class="text-gray-700 font-semibold">Senha:</label>
                    <input type="password" id="senha" name="senha" required
                           class="w-full mt-1 px-5 py-3 rounded-full bg-white shadow focus:ring-2 focus:ring-blue-400 outline-none">
                </div>
            </div>

           
            <div class="md:col-span-2 flex flex-col items-center mt-4">

                <button type="submit"
                        class="bg-yellow-400 text-black text-lg font-semibold px-10 py-3 rounded-full shadow hover:bg-yellow-300 transition">
                    Cadastrar
                </button>

                <p class="mt-3 text-gray-700">Já possui uma conta?</p>
                <a href="{{ url_for('login') }}" class="text-blue-600 font-semibold hover:underline">
                    Entrar
                </a>
            </div>

        </form>

        <img src="/static/img/dogpettt.png"
     class="hidden md:block w-60 absolute bottom-[-40px] right-0 pointer-events-none select-none">


        
    </div>

</div>

{% endblock %}
